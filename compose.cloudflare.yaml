# Permanent hostname: create a tunnel and set its token in .env first.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env; see docs/CLOUDFLARE.md}
    depends_on:
      web:
        condition: service_healthy
