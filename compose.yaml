name: intrac

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      INTRAC_DB_PATH: /data/intrac.db
      INTRAC_COOKIE_SECURE: ${INTRAC_COOKIE_SECURE:-false}
    volumes:
      - intrac_data:/data

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      INTRAC_SITE_ADDRESS: ${INTRAC_SITE_ADDRESS:-:80}
      INTRAC_TLS_DIRECTIVE: ${INTRAC_TLS_DIRECTIVE:-}
    ports:
      - "${INTRAC_BIND_ADDRESS:-127.0.0.1}:${INTRAC_HTTP_PORT:-80}:80"
      - "${INTRAC_BIND_ADDRESS:-127.0.0.1}:${INTRAC_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  intrac_data:
  caddy_data:
  caddy_config:
